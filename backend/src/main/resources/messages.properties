# Títulos y detalles en español de los errores que genera Spring MVC (problem+json, RNF08).
# Claves: problemDetail.title.<excepción> y problemDetail.<excepción> (ver ErrorResponse en Spring).
# Sintaxis de java.text.MessageFormat: no usar comillas simples.

problemDetail.title.org.springframework.http.converter.HttpMessageNotReadableException=Solicitud ilegible
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=El cuerpo de la solicitud falta o no es un JSON válido.

problemDetail.title.org.springframework.web.servlet.resource.NoResourceFoundException=Ruta no encontrada
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=La ruta solicitada no existe.

problemDetail.title.org.springframework.web.HttpRequestMethodNotSupportedException=Método no permitido
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=El método {0} no está permitido en esta ruta.

problemDetail.title.org.springframework.web.HttpMediaTypeNotSupportedException=Tipo de contenido no admitido
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=El tipo de contenido {0} no es compatible. Usa application/json.

problemDetail.title.org.springframework.web.HttpMediaTypeNotAcceptableException=Formato no disponible
problemDetail.org.springframework.web.HttpMediaTypeNotAcceptableException=No se puede responder en el formato solicitado.

problemDetail.title.org.springframework.web.bind.MissingServletRequestParameterException=Falta un parámetro
problemDetail.org.springframework.web.bind.MissingServletRequestParameterException=Falta el parámetro obligatorio «{0}».

problemDetail.title.org.springframework.web.method.annotation.MethodArgumentTypeMismatchException=Parámetro inválido
problemDetail.title.org.springframework.beans.TypeMismatchException=Parámetro inválido
problemDetail.org.springframework.beans.TypeMismatchException=El valor «{1}» no es válido para «{0}».

problemDetail.title.org.springframework.web.multipart.MaxUploadSizeExceededException=Archivo demasiado grande
problemDetail.org.springframework.web.multipart.MaxUploadSizeExceededException=El archivo supera el tamaño máximo permitido.
