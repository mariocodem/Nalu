- changeSet:
    id: fase-1-check-stock
    author: nalu
    comment: >-
      RNF10: la existencia nunca es negativa ni menor que lo reservado. Liquibase Community no genera
      el @Check de VarianteProducto en el diff; es la excepción de SQL documentada en el plan §5.1.
    changes:
    - sql:
        sql: >-
          ALTER TABLE variante_producto ADD CONSTRAINT ck_variante_producto_stock
          CHECK (stock_actual >= 0 AND stock_reservado >= 0 AND stock_reservado <= stock_actual)
    rollback:
    - sql:
        sql: ALTER TABLE variante_producto DROP CONSTRAINT ck_variante_producto_stock
