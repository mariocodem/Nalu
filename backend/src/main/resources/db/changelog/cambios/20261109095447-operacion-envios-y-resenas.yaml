- changeSet:
    id: fase-5-check-calificacion
    author: nalu
    changes:
    - sql:
        sql: ALTER TABLE resena ADD CONSTRAINT ck_resena_calificacion CHECK (calificacion BETWEEN 1 AND 5)
    rollback:
    - sql:
        sql: ALTER TABLE resena DROP CONSTRAINT ck_resena_calificacion
